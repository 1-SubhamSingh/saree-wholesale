services:
  mongodb:
    image: mongo:4.4
    container_name: saree-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-saree_wholesale}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saree-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saree-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/saree_wholesale}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/saree_wholesale}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin1}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - JWT_SECRET=${JWT_SECRET:-saree-wholesale-secure-jwt-signing-secret-key-2026-min256bit!}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - saree-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: saree-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - saree-network

volumes:
  mongo-data:
    name: saree-mongo-data
  backend-uploads:
    name: saree-backend-uploads

networks:
  saree-network:
    name: saree-network
    driver: bridge
