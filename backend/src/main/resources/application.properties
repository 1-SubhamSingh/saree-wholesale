spring.application.name=backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/saree_wholesale}

# Admin Security & Credentials
admin.username=${ADMIN_USERNAME:admin1}
admin.password=${ADMIN_PASSWORD:admin123}
admin.password-hash=${ADMIN_PASSWORD_HASH:}

# JWT Configuration
jwt.secret=${JWT_SECRET:saree-wholesale-secure-jwt-signing-secret-key-2026-min256bit!}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# File / payload constraints
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
