spring.application.name=backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/saree_wholesale}

# Admin Security & Credentials
admin.username=${ADMIN_USERNAME:admin1}
admin.password=${ADMIN_PASSWORD:admin123}
admin.password-hash=${ADMIN_PASSWORD_HASH:}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://localhost:3000,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1}

# File / payload constraints
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# Email Notification Configuration (Environment variables only)
app.email.enabled=${EMAIL_ENABLED:false}
app.email.owner=${OWNER_EMAIL:admin@rajwadasarees.com}
app.email.from=${FROM_EMAIL:noreply@rajwadasarees.com}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Spam Protection & Rate Limiting Configuration
app.security.ratelimit.requests-per-window=${ENQUIRY_RATE_LIMIT:10}
app.security.ratelimit.window-seconds=${ENQUIRY_RATE_LIMIT_WINDOW_SECONDS:300}
app.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
app.security.turnstile.secret=${TURNSTILE_SECRET_KEY:}
