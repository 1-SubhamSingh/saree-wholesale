name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend – compile, test, package
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        # Start mongod with replica set mode enabled.
        # The health check uses the plain ping first; rs.initiate() happens in a step below.
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # CI-only test credentials – never use production secrets here.
      # Override these via GitHub repository secrets for real environments.
      MONGODB_URI: mongodb://localhost:27017/saree_wholesale_ci?replicaSet=rs0
      ADMIN_USERNAME: ${{ secrets.CI_ADMIN_USERNAME || 'admin1' }}
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD || 'admin123' }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'saree-wholesale-secure-jwt-signing-secret-key-2026-min256bit!' }}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost,http://localhost:3000,http://localhost:4173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restart MongoDB with replica-set flag
        # The service container starts a plain mongod. We stop it, then start a
        # fresh mongod process with --replSet rs0 on the same port.
        run: |
          docker ps --filter "ancestor=mongo:6.0" -q | xargs -r docker stop
          docker run --rm -d \
            --network host \
            --name mongo-rs \
            mongo:6.0 mongod --replSet rs0 --bind_ip_all --port 27017
          # Wait until mongod accepts connections.
          for i in $(seq 1 20); do
            mongosh --port 27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Initialise replica set
        run: |
          mongosh --port 27017 --eval "
            try { rs.status() } catch(e) {
              rs.initiate({_id:'rs0', members:[{_id:0, host:'127.0.0.1:27017'}]});
            }
          "
          # Wait until this node is PRIMARY.
          for i in $(seq 1 20); do
            STATE=$(mongosh --port 27017 --quiet --eval "rs.status().myState")
            [ "$STATE" = "1" ] && echo "PRIMARY elected" && break
            echo "Waiting for PRIMARY (state=$STATE)..."
            sleep 2
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Single Maven invocation: compile + test + package in one lifecycle.
      # Tests run against the CI MongoDB replica set started above.
      - name: Build, test, and package
        run: mvn clean package

  # ─────────────────────────────────────────────
  # Job 2: Frontend – lint, test, build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # `npm test` runs: node --test test/**/*.test.js (defined in package.json).
      # This reliably picks up test/cataloguePagination.test.js.
      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 3: Docker Compose build verification
  # ─────────────────────────────────────────────
  docker:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
